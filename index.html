<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P2P Chat</title>
<style>
:root{--bg:#141415;--card:#1e1e20;--line:#2d2d30;--txt:#ececec;--mut:#9a9aa0;--acc:#4f8cff;--ok:#2ecc71;--bad:#e74c3c}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;height:100dvh;display:flex;flex-direction:column}
header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{font-size:18px}
#status{font-size:13px;padding:4px 10px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
#status.on{color:var(--ok)} #status.off{color:var(--bad)}
#connect{padding:16px;display:grid;gap:12px;max-width:520px;width:100%;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px}
.code{font-size:28px;letter-spacing:4px;text-align:center;font-family:monospace;direction:ltr;user-select:all}
input[type=text]{background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px;width:100%;direction:ltr;text-align:center}
button{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-size:15px;cursor:pointer}
button.sec{background:var(--line)} button.bad{background:var(--bad)}
button:disabled{opacity:.5;cursor:not-allowed}
#app{display:none;flex:1;min-height:0;flex-direction:column}
#toolbar{display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:80%;padding:9px 13px;border-radius:14px;word-break:break-word;line-height:1.5;font-size:15px}
.me{align-self:flex-start;background:var(--acc)} .peer{align-self:flex-end;background:var(--card);border:1px solid var(--line)}
.sys{align-self:center;color:#9a9aa0;font-size:12px}
.file a{color:#fff;font-weight:bold}
.bar{height:5px;background:rgba(255,255,255,.2);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok)}
form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
form input{flex:1;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:22px;padding:11px 16px;font-size:15px}
#remoteAudio{display:none}
</style>
</head>
<body>
<header><h1>💬 دردشة P2P</h1><span id="status" class="off">غير متصل</span></header>

<div id="connect">
  <div class="card">
    <div>كودك (شاركه مع الطرف الآخر):</div>
    <div class="code" id="myCode">...</div>
    <button class="sec" id="copyBtn">نسخ الكود</button>
  </div>
  <div class="card">
    <div>أو اتصل بكود صديقك:</div>
    <input type="text" id="peerCode" placeholder="ABC123" maxlength="6" autocapitalize="characters">
    <button id="connBtn">اتصال</button>
  </div>
</div>

<div id="app">
  <div id="toolbar">
    <button id="callBtn">🎤 مكالمة صوتية</button>
    <button id="muteBtn" class="sec" style="display:none">كتم</button>
    <button id="fileBtn" class="sec">📎 إرسال ملف</button>
    <button id="leaveBtn" class="bad">إنهاء</button>
    <input type="file" id="fileInput" hidden multiple>
  </div>
  <div id="msgs"></div>
  <form id="form"><input id="txt" placeholder="اكتب رسالة..." autocomplete="off"><button>إرسال</button></form>
</div>
<audio id="remoteAudio" autoplay></audio>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const CHUNK=16*1024;
let peer,conn,call,local,incoming={};

const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const myId=Array.from({length:6},()=>chars[Math.floor(Math.random()*chars.length)]).join('');
const PREFIX='p2pchat-';

function setStatus(t,on){const s=$('status');s.textContent=t;s.className=on?'on':'off'}
function add(cls,text){const d=document.createElement('div');d.className='m '+cls;d.textContent=text;$('msgs').append(d);scroll();return d}
function scroll(){$('msgs').scrollTop=1e9}
function fmt(b){return b>1e6?(b/1e6).toFixed(1)+' MB':(b/1e3).toFixed(0)+' KB'}

peer=new Peer(PREFIX+myId);
peer.on('open',()=>{$('myCode').textContent=myId;setStatus('جاهز',false)});
peer.on('error',e=>{
  if(e.type==='unavailable-id'){location.reload();return}
  if(e.type==='peer-unavailable'){alert('الكود غير موجود أو الطرف غير متصل');$('connBtn').disabled=false;return}
  console.error(e);add('sys','خطأ: '+e.type)
});
peer.on('connection',c=>{ if(conn){c.close();return} setup(c) });
peer.on('call',async c=>{
  try{
    local=await navigator.mediaDevices.getUserMedia({audio:true});
    c.answer(local); bindCall(c);
  }catch(e){add('sys','تعذّر الوصول للميكروفون');c.close()}
});

$('copyBtn').onclick=()=>{navigator.clipboard?.writeText(myId);$('copyBtn').textContent='تم النسخ ✓';setTimeout(()=>$('copyBtn').textContent='نسخ الكود',1500)};
$('connBtn').onclick=()=>{
  const c=$('peerCode').value.trim().toUpperCase();
  if(c.length<4)return;
  $('connBtn').disabled=true;
  setup(peer.connect(PREFIX+c,{reliable:true}));
};

function setup(c){
  conn=c;
  c.on('open',()=>{
    $('connect').style.display='none';$('app').style.display='flex';
    setStatus('متصل ✓',true);add('sys','تم الاتصال المباشر (P2P)');
  });
  c.on('data',onData);
  c.on('close',()=>{add('sys','انقطع الاتصال');setStatus('غير متصل',false);endCall();conn=null;$('connBtn').disabled=false});
}

function onData(d){
  if(d.t==='msg')add('peer',d.text);
  else if(d.t==='fmeta'){
    const el=add('peer file','📥 يستقبل: '+d.name+' ('+fmt(d.size)+')');
    el.insertAdjacentHTML('beforeend','<div class="bar"><i></i></div>');
    incoming[d.id]={...d,chunks:[],got:0,el};
  }else if(d.t==='fchunk'){
    const f=incoming[d.id];if(!f)return;
    f.chunks.push(d.data);f.got+=d.data.byteLength;
    f.el.querySelector('i').style.width=(f.got/f.size*100)+'%';
  }else if(d.t==='fend'){
    const f=incoming[d.id];if(!f)return;
    const url=URL.createObjectURL(new Blob(f.chunks,{type:f.type}));
    f.el.textContent='';
    const a=document.createElement('a');a.href=url;a.download=f.name;a.textContent='⬇ '+f.name+' ('+fmt(f.size)+')';
    f.el.append(a);delete incoming[d.id];
  }
}

$('form').onsubmit=e=>{
  e.preventDefault();const t=$('txt').value.trim();
  if(!t||!conn)return;
  conn.send({t:'msg',text:t});add('me',t);$('txt').value='';
};

$('fileBtn').onclick=()=>$('fileInput').click();
$('fileInput').onchange=async e=>{
  for(const f of e.target.files)await sendFile(f);
  e.target.value='';
};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function sendFile(file){
  if(!conn)return;
  const id=Math.random().toString(36).slice(2);
  const el=add('me file','📤 يرسل: '+file.name+' ('+fmt(file.size)+')');
  el.insertAdjacentHTML('beforeend','<div class="bar"><i></i></div>');
  conn.send({t:'fmeta',id,name:file.name,size:file.size,type:file.type});
  for(let o=0;o<file.size;o+=CHUNK){
    const buf=await file.slice(o,o+CHUNK).arrayBuffer();
    while(conn.dataChannel&&conn.dataChannel.bufferedAmount>1e6)await sleep(30);
    conn.send({t:'fchunk',id,data:buf});
    el.querySelector('i').style.width=Math.min(100,(o+CHUNK)/file.size*100)+'%';
  }
  conn.send({t:'fend',id});
  el.firstChild.textContent='✅ تم إرسال: '+file.name;
}

$('callBtn').onclick=async()=>{
  if(call){endCall();return}
  try{
    local=await navigator.mediaDevices.getUserMedia({audio:true});
    bindCall(peer.call(conn.peer,local));
  }catch(e){add('sys','تعذّر الوصول للميكروفون (يلزم HTTPS وإذن المتصفح)')}
};
function bindCall(c){
  call=c;
  c.on('stream',s=>{$('remoteAudio').srcObject=s;$('remoteAudio').play().catch(()=>{})});
  c.on('close',endCall);
  $('callBtn').textContent='📞 إنهاء المكالمة';$('callBtn').classList.add('bad');
  $('muteBtn').style.display='';add('sys','المكالمة الصوتية بدأت');
}
function endCall(){
  if(call){call.close();call=null;add('sys','انتهت المكالمة')}
  local?.getTracks().forEach(t=>t.stop());local=null;
  $('remoteAudio').srcObject=null;
  $('callBtn').textContent='🎤 مكالمة صوتية';$('callBtn').classList.remove('bad');
  $('muteBtn').style.display='none';$('muteBtn').textContent='كتم';
}
$('muteBtn').onclick=()=>{
  const t=local?.getAudioTracks()[0];if(!t)return;
  t.enabled=!t.enabled;$('muteBtn').textContent=t.enabled?'كتم':'إلغاء الكتم';
};
$('leaveBtn').onclick=()=>{endCall();conn?.close();location.reload()};
</script>
</body>
</html>
