<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APKDroid - إرسال الإشعارات</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h2 { color: #00ff88; margin-bottom: 10px; }
        p { color: #b0b0b0; font-size: 14px; margin-bottom: 20px; }
        button {
            background: #00ff88;
            color: #121212;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.3s;
        }
        button:hover {
            background: #00cc6a;
        }
        #status {
            margin-top: 15px;
            font-size: 13px;
            color: #ffaa00;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>APKDroid</h2>
        <p>اضغط على الزر أدناه لتفعيل وإرسال إشعار تجريبي من المتجر.</p>
        <button onclick="requestAndNotify()">إرسال إشعار</button>
        <div id="status"></div>
    </div>

    <script>
        function requestAndNotify() {
            const statusDiv = document.getElementById('status');

            // 1. التحقق مما إذا كان المتصفح يدعم الإشعارات
            if (!("Notification" in window)) {
                alert("متصفحك لا يدعم إشعارات الويب.");
                return;
            }

            // 2. التحقق من حالة الإذن الحالي
            if (Notification.permission === "granted") {
                // إذا كان مصرحاً به مسبقاً، أرسل الإشعار مباشرة
                sendAPKDroidNotification();
            } 
            else if (Notification.permission !== "denied") {
                // إذا لم يتم الرد بعد، اطلب الإذن من المستخدم
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") {
                        statusDiv.textContent = "تم منح الإذن بنجاح!";
                        sendAPKDroidNotification();
                    } else {
                        statusDiv.textContent = "تم رفض إذن الإشعارات من قبل المستخدم.";
                    }
                });
            } 
            else {
                // إذا كان المستخدم قد حظر الإشعارات مسبقاً
                statusDiv.textContent = "الإشعارات محظورة. يرجى تفعيلها يدوياً من إعدادات المتصفح.";
            }
        }

        // دالة إنشاء وإرسال الإشعار
        function sendAPKDroidNotification() {
            const options = {
                body: "مرحباً بك في APKDroid! تم تفعيل الإشعارات بنجاح.",
                icon: "https://cdn-icons-png.flaticon.com/512/2921/2921222.html", // أيقونة تجريبية
                dir: "rtl"
            };

            const notification = new Notification("APKDroid Store", options);

            // الحدث عند النقر على الإشعار
            notification.onclick = function() {
                window.focus();
                alert("مرحباً بك مجدداً في متجرك المفضّل!");
            };
        }
    </script>

</body>
</html>
